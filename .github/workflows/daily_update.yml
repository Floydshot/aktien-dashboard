name: Update stocks and deploy dashboard

on:
  schedule:
    # Fixed UTC: 08:30 CEST in summer, 07:30 CET in winter (Europe/Berlin).
    # GitHub schedules are best effort and may start later than scheduled.
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - data.json
      - update_data.py
      - requirements.txt
      - .github/workflows/daily_update.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-dashboard-main
  cancel-in-progress: false

jobs:
  update-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        if: github.event_name != 'push'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: github.event_name != 'push'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh market data
        id: market-data
        if: github.event_name != 'push'
        # Publish explicit stale status on a total provider outage, then flag
        # the run as failed after deployment so it remains visible in Actions.
        continue-on-error: true
        run: python update_data.py

      - name: Commit updated dataset
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh stock dashboard data'
          # An intervening human push must not be overwritten.
          git pull --rebase origin main
          git push origin HEAD:main

      # A GITHUB_TOKEN commit does not trigger a branch-based Pages build.
      # Deploy the updated files explicitly in this same workflow instead.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage only public dashboard files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -- index.html data.json _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report provider outage
        if: steps.market-data.outcome == 'failure'
        run: |
          echo '::error::Market data update failed. Last available values and stale status were published; inspect the refresh step.'
          exit 1
